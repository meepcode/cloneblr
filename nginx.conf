# nginx/nginx.conf

# Run as root inside the container (single-container prod simulation)
user root;
worker_processes auto;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  sendfile        on;
  keepalive_timeout 65;

  server {
    listen 80;

    # ── API: proxy to Express on localhost:3000 ──────────────
    # Both nginx and node run in the same container,
    # so localhost resolves correctly here.
    location /api/ {
      proxy_pass         http://express-server:3000;
      proxy_http_version 1.1;

      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      # Disable buffering for streaming responses (useful for SSE later)
      proxy_buffering off;
    }

    # ── Client: serve React SPA static files ─────────────────
    location / {
      root  /prod/client/dist;
      index index.html;

      # All unmatched routes fall back to index.html so TanStack
      # Router can handle client-side navigation on hard refresh
      try_files $uri $uri/ /index.html;
    }
  }
}
